name: NIFTY Telegram Bot & Scanner

on:
  schedule:
    # Runs every 5 minutes, Monday through Friday, from 3:30 AM to 10:30 AM UTC (9:00 AM to 4:00 PM IST)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime from the GitHub website

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Telegram Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nifty_telegram_bot.py
