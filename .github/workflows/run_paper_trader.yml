name: Nifty Paper Trader Engine

on:
  schedule:
    # Session 1: 09:15 AM IST (03:45 AM UTC) -> Monday to Friday
    - cron: '45 3 * * 1-5'
    # Session 2: 12:30 PM IST (07:00 AM UTC) -> Monday to Friday
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests numpy

      - name: Run Paper Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python paper_trader.py

      - name: Save Trade Logs & State to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategy_state.json paper_trades.csv || true
          git commit -m "Auto-update paper trade logs [skip ci]" || echo "No trade changes to commit"
          git push origin main || echo "Nothing to push"
