name: Nifty Live Scanner & Paper Trader

on:
  schedule:
    # 03:35 AM UTC = 09:05 AM IST (Monday to Friday)
    - cron: '35 3 * * 1-5'
  workflow_dispatch:

# Explicitly grant write permissions to push trade logs back to the repo
permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 390 # 6.5 hours (full market session)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy

      - name: Run All-in-One Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nifty_trader.py

      - name: Commit State and Paper Trade Logs
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update strategy state & trade logs [skip ci]" && git push)
