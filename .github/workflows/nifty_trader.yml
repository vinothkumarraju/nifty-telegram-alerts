name: Nifty Live Strategy Runner

on:
  schedule:
    # 06:05 PM IST (12:35 UTC) & 06:10 PM IST (12:40 UTC)
    - cron: '35,40 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Strategy Single-Pass
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nifty_trader.py

      - name: Commit & Push State Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategy_state.json paper_trades.csv || true
          git commit -m "Auto-update strategy state & logs [skip ci]" || echo "No changes to commit"
          git push || true
