name: Nifty Live Strategy Runner

on:
  schedule:
    # 09:00 AM IST -> Morning Startup Readiness Check (03:30 UTC)
    - cron: '30 3 * * 1-5'
    # 09:10 AM IST -> Pre-Market Gap Analysis Alert (03:40 UTC)
    - cron: '40 3 * * 1-5'
    # 09:15 AM IST -> Market Open Instant Gap Momentum Fill (03:45 UTC)
    - cron: '45 3 * * 1-5'
    # Every :15 and :45 minutes from 09:45 AM to 03:15 PM IST (04:15 to 09:45 UTC)
    - cron: '15,45 4-9 * * 1-5'
    # 03:25 PM IST -> EOD Crossover Confirmation Check (09:55 UTC)
    - cron: '55 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Strategy Single-Pass
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nifty_trader.py

      - name: Commit & Push State Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategy_state.json paper_trades.csv || true
          git commit -m "Auto-update strategy state & logs [skip ci]" || echo "No changes to commit"
          git push || true
