name: Live Nifty Real-Time Scanner

on:
  schedule:
    # Session 1: Starts at 09:15 AM IST (03:45 AM UTC) -> Runs 3 hours
    - cron: '45 3 * * 1-5'
    # Session 2: Starts at 12:30 PM IST (07:00 AM UTC) -> Runs 3 hours
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  realtime-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests numpy

      - name: Run Live Real-Time Scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner.py
